name: Publish Usage Stats

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON snapshot from local machine (leave empty to probe via ANTHROPIC_OAUTH_TOKEN)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish snapshot
        env:
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          INPUT_PAYLOAD: ${{ inputs.payload }}
        run: node scripts/publish-actions.js
