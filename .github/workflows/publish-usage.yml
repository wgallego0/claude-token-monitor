name: Publish Usage Stats

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON snapshot da máquina local (opcional)'
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish snapshot
        env:
          # Preferido: refresh token (vida útil ~meses, auto-refresh a cada run)
          ANTHROPIC_REFRESH_TOKEN: ${{ secrets.ANTHROPIC_REFRESH_TOKEN }}
          # Legado: access token direto (~1h, precisa atualizar manual)
          ANTHROPIC_OAUTH_TOKEN:   ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          INPUT_PAYLOAD:           ${{ inputs.payload }}
        run: node scripts/publish-actions.js
